<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background so the maskable version survives any mask shape. -->
  <rect width="512" height="512" fill="#1f7a4d"/>
  <!-- Ball kept inside the central 60% (maskable safe zone is the inner 80% circle). -->
  <circle cx="256" cy="256" r="150" fill="#c8e64b"/>
  <g fill="#1f7a4d">
    <circle cx="206" cy="196" r="20"/>
    <circle cx="306" cy="196" r="20"/>
    <circle cx="256" cy="256" r="20"/>
    <circle cx="206" cy="316" r="20"/>
    <circle cx="306" cy="316" r="20"/>
  </g>
</svg>
