services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: dinkup
      POSTGRES_PASSWORD: dinkup
      POSTGRES_DB: dinkup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/prisma/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
